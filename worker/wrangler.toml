# Dev/test config for this repository. Consumers don't use this file — they
# write their own wrangler.toml against the published `ziscus/worker` bundle
# (see README → "1. Deploy the Worker"). ziscus.com's real config lives in
# its own private site repo.
# Deliberately NOT "ziscus" — that name is the production Worker, deployed only
# from the private site repo. A stray `wrangler deploy` here must not touch it.
name = "ziscus-dev"
main = "src/index.ts"
compatibility_date = "2025-09-27"

# Tiny fixture site so the flash-cookie / paused-slug HTMLRewriter paths are
# exercised end-to-end in tests. Consumers point this at their real build output.
[assets]
directory = "test/site"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "ziscus-comments"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
ALLOWED_ORIGINS = "example.com"
MODERATION = "off"
RATE_LIMIT = "30"
GITHUB_REPO = "you/your-site-repo"

[ai]
binding = "AI_MOD"

# Secrets — set via `wrangler secret put`, never commit values:
# ADMIN_SECRET — for approving/rejecting comments
# GITHUB_TOKEN — for repository_dispatch rebuild triggers
